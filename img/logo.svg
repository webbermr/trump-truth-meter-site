<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1633"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="translate(200 212) scale(0.9) translate(-200 -212)">
  <!-- stars -->
  <g fill="#ffffff" opacity=".85">
    <path id="st" d="M0,-7 L2,-2.2 7,-2.2 3,1 4.4,6 0,3 -4.4,6 -3,1 -7,-2.2 -2,-2.2Z" transform="translate(150,62)"/>
    <use href="#st" transform="translate(50,-10)"/>
    <use href="#st" transform="translate(100,0)"/>
  </g>
  <!-- gauge: five bands from Untruthful (left) to Truthful (right); centre 200,235, r 128 -->
  <g fill="none" stroke-width="34" stroke-linecap="butt">
    <path d="M72,235 A128,128 0 0 1 96.4,159.8" stroke="#dc2626"/>
    <path d="M96.9,159.1 A128,128 0 0 1 160.4,113.3" stroke="#ea7a12"/>
    <path d="M161.2,113 A128,128 0 0 1 238.8,113" stroke="#eab308"/>
    <path d="M239.6,113.3 A128,128 0 0 1 303.1,159.1" stroke="#65a30d"/>
    <path d="M303.6,159.8 A128,128 0 0 1 328,235" stroke="#16a34a"/>
  </g>
  <!-- ticks -->
  <g stroke="#0b1633" stroke-width="4">
    <line x1="96.6" y1="159.4" x2="68" y2="138.6"/>
    <line x1="160.8" y1="113.2" x2="149.9" y2="79.5"/>
    <line x1="239.2" y1="113.2" x2="250.1" y2="79.5"/>
    <line x1="303.4" y1="159.4" x2="332" y2="138.6"/>
  </g>
  <!-- needle -->
  <g transform="rotate(-24 200 235)">
    <path d="M200,112 L209,235 L191,235 Z" fill="#ffffff"/>
  </g>
  <circle cx="200" cy="235" r="20" fill="#ffffff"/>
  <circle cx="200" cy="235" r="8" fill="#0b1633"/>
  <!-- wordmark -->
  <text x="200" y="300" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="2" fill="#ffffff">TRUTH METER</text>
  <text x="200" y="332" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="5" fill="#93c5fd">AI FACT-CHECK</text>
  </g>
</svg>
